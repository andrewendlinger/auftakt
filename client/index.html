<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.svg" />
    <title>Auftakt</title>

    <!-- Two conditions, both decided here because the overlay below paints before any
         other script of ours runs.

         Built bundle only. `%PROD%` is Vite's HTML env replacement, and it is applied by
         the dev-server middleware and the build alike, so it reads 'false' on :5317 and
         'true' in client/dist — which is what Electron loads in both of its modes. The
         overlay covers the viewport and holds its pointer events for ~2.6 s; on the dev
         server that is the surface docs/VERIFYING.md tells agents to drive, and it would
         swallow the first interaction of every run. It is quoted rather than compared
         bare so that a replacement which never happens degrades to „no animation"
         instead of a syntax error, which would leave the overlay on screen for good.

         Cold start only. sessionStorage survives a reload of the same tab but is empty in
         a fresh process, which is exactly the distinction wanted: season switch and the
         post-backup-dir reload skip it, a relaunch plays it. -->
    <script>
      try {
        if ('%PROD%' !== 'true' || sessionStorage.getItem('auftakt-booted')) {
          document.documentElement.classList.add('no-boot');
        }
        sessionStorage.setItem('auftakt-booted', '1');
      } catch {
        /* Storage can be unavailable; then the gesture simply plays. */
      }
    </script>

    <style>
      /* The Auftakt gesture: a conductor's preparatory beat, played once on a cold start.
         Pure SVG + CSS in the app's own colours. Timings are the "Attacca" choreography:
         2700 ms total, ictus (wordmark) at 1880 ms, hand fading from 2410 ms.

         It is played in two phases, and the split is the whole point. The overlay used to
         start its keyframes the instant it painted — which is the instant the renderer
         starts fetching, parsing and compiling a 1.3 MB bundle and mounting React. Its
         frames competed with the app's startup by construction, and almost none of this
         can be handed to the compositor to escape that: traced, bootMotion reports
         compositeFailed 8320 (`offset-distance`) and the two trail strokes report 8224
         (`stroke-dashoffset`). Five of the twelve animations here are drawn by the
         renderer's main thread, every frame.

         So phase A holds a still, empty frame — flat colour, nothing moving, indefinitely
         and harmlessly — until the app signals that it is mounted and the main thread is
         idle. Only then does phase B release the animation, onto a thread with nothing
         left to do. Everything below is `animation-play-state: paused` until
         `html.boot-play` says otherwise; the script at the end of <body> owns that class.

         Pausing rather than withholding the `animation` shorthand is deliberate: adding
         the shorthand later would construct the animations at that moment and re-run
         style and layout for them, at precisely the frame that has to be cheap. */
      #boot-overlay {
        --T: 2700; /* total */
        --ti: 1880; /* ictus */
        --tf: 2410; /* hand fades */

        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Matches body and the Electron window's backgroundColor, so window → overlay
           → app is seamless. */
        background: #f6f6f4;
        /* Two animations. bootOut is the reveal and waits for phase B like everything
           else; bootBail is a dead man's switch that never waits for anything.

           Before the phases, the overlay's fade was pure CSS and would run whether or not
           this file's script did — a script that threw left a transparent node and a
           usable app. Pausing everything took that away: a throw would now leave an
           opaque cream rectangle over a working app, with no reload affordance in a
           packaged window. So bootBail runs unconditionally, well past the latest reveal
           any live script can produce (1200 ms deadline + 3070 ms gesture + 400 ms
           failsafe = 4670 ms), and ends on visibility: hidden so the corpse stops
           swallowing clicks too — which the old opacity-only fade never did. */
        animation:
          bootOut 370ms linear calc((var(--ti) + 350) * 1ms) both,
          bootBail 400ms linear 6000ms both;
      }
      /* Nothing runs until phase B — except the bail, which is why the play-state is a
         list rather than a single value. The universal selector is the point: a list of
         animated selectors here would silently miss the next one added below. */
      #boot-overlay {
        animation-play-state: paused, running;
      }
      #boot-overlay * {
        animation-play-state: paused;
      }
      html.boot-play #boot-overlay {
        animation-play-state: running, running;
      }
      html.boot-play #boot-overlay * {
        animation-play-state: running;
      }
      /* The reveal when the gesture does not play: too slow to earn it, or the user
         clicked. Its own keyframes so it starts from full opacity rather than inheriting
         whatever progress a long fade had made — the same reason the old .boot-skip
         existed, which this replaces. */
      #boot-overlay.boot-cross {
        animation: bootCross 200ms linear both;
        animation-play-state: running;
      }
      html.no-boot #boot-overlay {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-overlay {
          display: none;
        }
      }

      #boot-overlay svg {
        display: block;
        width: min(720px, 70vw);
        height: auto;
        /* Phase A shows nothing at all. Not the parked hand, and above all not the
           wordmark: the gesture's entire payload is the wordmark *landing* on the ictus,
           and a wordmark already on screen makes that land on nothing. A blank coloured
           rectangle also reads as a window that has not drawn yet rather than as a stall,
           which is what it should read as — it may be on screen for a while. */
        visibility: hidden;
      }
      html.boot-play #boot-overlay svg {
        visibility: visible;
      }

      /* React mounts and lays out underneath during phase A, and its paint would
         otherwise be recorded, rastered and then painted over — occlusion culling works
         on composited layers, and neither of these is guaranteed one. `visibility` skips
         the painting but still runs layout, including text measurement, so the reveal is
         instant and none of that work is wasted. `content-visibility: hidden` would skip
         layout too and hand the whole first layout to the reveal frame, which is the one
         frame that must not hitch. */
      html.boot-hold #root {
        visibility: hidden;
      }

      /* Wordmark: one centred text element landing as a block on the ictus — bold and
         gesperrt. The x offset compensates the trailing letter-spacing of the last
         glyph, so the word sits optically centred. */
      #boot-overlay .word text {
        fill: #1c1c1e;
        font:
          700 72px 'Inter',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        letter-spacing: 9px;
      }
      #boot-overlay .lt {
        /* Its visible state comes entirely from bootLetterIn's backwards fill, so the
           base has to hide it. Otherwise cancelling that animation — which the frame
           watchdog does when it aborts — reverts to base style and snaps the wordmark to
           full opacity, in the middle of a fade. .mover, .ripple and .trailg already
           carry opacity: 0 for the same reason. */
        opacity: 0;
        animation: bootLetterIn 380ms cubic-bezier(0.2, 0.9, 0.3, 1) calc(var(--ti) * 1ms) both;
      }

      #boot-overlay .ripple {
        transform-box: fill-box;
        transform-origin: center;
        fill: none;
        stroke: #3c3c3b;
        opacity: 0;
      }
      #boot-overlay .ripple.r1 {
        stroke-width: 1.6;
        animation: bootRipple1 560ms calc(var(--ti) * 1ms) both;
      }
      #boot-overlay .ripple.r2 {
        stroke-width: 1;
        animation: bootRipple2 620ms calc((var(--ti) + 110) * 1ms) both;
      }

      /* The ink trace behind the baton tip: a soft wide halo and a fine core, drawn as
         sliding dash windows (200 / 110 path units) along the same path the hand
         travels. Their keyframes share bootMotion's percentages and easings, so tip and
         ink stay synchronized by construction. pathLength pins the browser's arc-length
         arithmetic to the value the offsets were computed against. The base
         stroke-dashoffset parks the window before the path start, so with animations
         off nothing shows until the failsafe removes the overlay.

         The halo is a wide, very faint stroke rather than a narrower blurred one, which
         is why its width and opacity look untuned (14 at 5.5 % against the core's 3 at
         45 %): they were picked so a hard-edged stroke reads as diffuse. `filter: blur()`
         here was by far the most expensive thing on screen. stroke-dashoffset is a paint
         property, so Chromium cannot composite it — traced, it reports
         `compositeFailed: 8224, unsupportedProperties: ['stroke-dashoffset']` — and the
         blur then re-rastered that repainted region at device pixel ratio every frame.
         Measured over the gesture: 204 ms of renderer paint+raster with the blur against
         79 ms without, 163 ms of it in RasterTask alone versus 43 ms. The trail's own
         cost is only ~16 ms of that. All of it lands on the one thread the hand's motion
         also needs, which likewise cannot composite (`offset-distance`). */
      #boot-overlay .trail {
        fill: none;
        stroke: #3c3c3b;
        stroke-linecap: round;
      }
      #boot-overlay .trail.soft {
        stroke-width: 14;
        opacity: 0.055;
        stroke-dashoffset: 200;
        animation: bootDashSoft calc(var(--T) * 1ms) both;
      }
      #boot-overlay .trail.core {
        stroke-width: 3;
        opacity: 0.45;
        stroke-dashoffset: 110;
        animation: bootDashCore calc(var(--T) * 1ms) both;
      }
      /* The trace appears a blink after the hand's first movement, then runs in sync;
         after the ictus it dissolves. bootTrailIn fills backwards only, so once it
         ends, bootTrailFade's backwards fill (opacity 1) carries the group until the
         fade — and during the first 150 ms the later entry in the list wins, keeping
         the group at 0. Reordering this list breaks the onset. */
      #boot-overlay .trailg {
        opacity: 0;
        animation:
          bootTrailFade 300ms calc((var(--ti) + 150) * 1ms) both,
          bootTrailIn 220ms 150ms backwards;
      }

      #boot-overlay .actor {
        fill: #3c3c3b;
      }
      /* Wrist pivot = tip of the baton. */
      #boot-overlay .swing {
        transform-box: fill-box;
        transform-origin: 100% 0;
        animation: bootSwing calc(var(--T) * 1ms) both;
      }
      /* The beat plane is vertical at x=344; the path begins and ends on the same
         point of it, as the pedagogy requires. */
      #boot-overlay .mover {
        opacity: 0;
        offset-rotate: 0deg;
        offset-path: path(
          'M280,404 C316,382 352,334 344,270 C343,272 342.6,274.5 342.5,275.5 C333,247 331,165 342,95 C343,150 344,215 344,270 C341,244 342,212 342,198 C342.5,206 343,216 343,222'
        );
        animation:
          bootMotion calc(var(--T) * 1ms) both,
          bootActorFade 260ms calc(var(--tf) * 1ms) both;
      }

      /* Arc-length shares of the phases along the 615.32-long path: slow entry into
         position, anticipation flick, rise, fall → ictus at 84.4 % arc / 69.6 % time,
         rebound under half a stroke. */
      @keyframes bootMotion {
        0% {
          offset-distance: 0%;
          animation-timing-function: cubic-bezier(0.35, 0, 0.25, 1);
        }
        44.444% {
          offset-distance: 25.508%;
          animation-timing-function: cubic-bezier(0.4, 0, 0.5, 1);
        }
        47.407% {
          offset-distance: 26.439%;
          animation-timing-function: cubic-bezier(0.45, 0.05, 0.2, 1);
        }
        61.852% {
          offset-distance: 55.939%;
          animation-timing-function: cubic-bezier(0.5, 0, 0.85, 0.35);
        }
        69.63% {
          offset-distance: 84.382%;
          animation-timing-function: cubic-bezier(0, 0.5, 0.35, 1);
        }
        77.037% {
          offset-distance: 96.096%;
          animation-timing-function: cubic-bezier(0.4, 0, 0.4, 1);
        }
        86.296% {
          offset-distance: 100%;
        }
        100% {
          offset-distance: 100%;
        }
      }
      /* The wrist trails the arm on the way up and whips through the ictus. */
      @keyframes bootSwing {
        0% {
          transform: rotate(-4deg);
          animation-timing-function: cubic-bezier(0.35, 0, 0.25, 1);
        }
        44.444% {
          transform: rotate(0deg);
          animation-timing-function: cubic-bezier(0.4, 0, 0.5, 1);
        }
        47.407% {
          transform: rotate(2.5deg);
          animation-timing-function: cubic-bezier(0.45, 0.05, 0.2, 1);
        }
        61.852% {
          transform: rotate(-5deg);
          animation-timing-function: cubic-bezier(0.5, 0, 0.85, 0.35);
        }
        69.63% {
          transform: rotate(6deg);
          animation-timing-function: cubic-bezier(0, 0.5, 0.35, 1);
        }
        77.037% {
          transform: rotate(-3deg);
          animation-timing-function: cubic-bezier(0.4, 0, 0.4, 1);
        }
        86.296% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }
      /* Dash offsets = window width minus the tip's arc position at each phase mark;
         computed against pathLength 615.32, one set per window width. */
      @keyframes bootDashSoft {
        0% {
          stroke-dashoffset: 200;
          animation-timing-function: cubic-bezier(0.35, 0, 0.25, 1);
        }
        44.444% {
          stroke-dashoffset: 43.05;
          animation-timing-function: cubic-bezier(0.4, 0, 0.5, 1);
        }
        47.407% {
          stroke-dashoffset: 37.32;
          animation-timing-function: cubic-bezier(0.45, 0.05, 0.2, 1);
        }
        61.852% {
          stroke-dashoffset: -144.2;
          animation-timing-function: cubic-bezier(0.5, 0, 0.85, 0.35);
        }
        69.63% {
          stroke-dashoffset: -319.22;
          animation-timing-function: cubic-bezier(0, 0.5, 0.35, 1);
        }
        77.037% {
          stroke-dashoffset: -391.29;
          animation-timing-function: cubic-bezier(0.4, 0, 0.4, 1);
        }
        86.296% {
          stroke-dashoffset: -415.32;
        }
        100% {
          stroke-dashoffset: -415.32;
        }
      }
      @keyframes bootDashCore {
        0% {
          stroke-dashoffset: 110;
          animation-timing-function: cubic-bezier(0.35, 0, 0.25, 1);
        }
        44.444% {
          stroke-dashoffset: -46.95;
          animation-timing-function: cubic-bezier(0.4, 0, 0.5, 1);
        }
        47.407% {
          stroke-dashoffset: -52.68;
          animation-timing-function: cubic-bezier(0.45, 0.05, 0.2, 1);
        }
        61.852% {
          stroke-dashoffset: -234.2;
          animation-timing-function: cubic-bezier(0.5, 0, 0.85, 0.35);
        }
        69.63% {
          stroke-dashoffset: -409.22;
          animation-timing-function: cubic-bezier(0, 0.5, 0.35, 1);
        }
        77.037% {
          stroke-dashoffset: -481.29;
          animation-timing-function: cubic-bezier(0.4, 0, 0.4, 1);
        }
        86.296% {
          stroke-dashoffset: -505.32;
        }
        100% {
          stroke-dashoffset: -505.32;
        }
      }
      @keyframes bootTrailIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes bootTrailFade {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes bootLetterIn {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes bootRipple1 {
        0% {
          transform: scale(0.12);
          opacity: 0;
        }
        10% {
          opacity: 0.5;
        }
        100% {
          transform: scale(1);
          opacity: 0;
        }
      }
      @keyframes bootRipple2 {
        0% {
          transform: scale(0.1);
          opacity: 0;
        }
        12% {
          opacity: 0.28;
        }
        100% {
          transform: scale(1);
          opacity: 0;
        }
      }
      @keyframes bootActorFade {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes bootOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes bootCross {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      /* Only ever seen if the script above died. visibility is not interpolated, it flips
         at the final keyframe, which is what takes the node out of hit-testing. */
      @keyframes bootBail {
        from {
          opacity: 1;
        }
        99% {
          opacity: 0;
          visibility: visible;
        }
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-overlay" aria-hidden="true">
      <svg viewBox="0 0 720 450">
        <g class="trailg">
          <path
            class="trail soft"
            pathLength="615.32"
            stroke-dasharray="200 616"
            d="M280,404 C316,382 352,334 344,270 C343,272 342.6,274.5 342.5,275.5 C333,247 331,165 342,95 C343,150 344,215 344,270 C341,244 342,212 342,198 C342.5,206 343,216 343,222"
          />
          <path
            class="trail core"
            pathLength="615.32"
            stroke-dasharray="110 616"
            d="M280,404 C316,382 352,334 344,270 C343,272 342.6,274.5 342.5,275.5 C333,247 331,165 342,95 C343,150 344,215 344,270 C341,244 342,212 342,198 C342.5,206 343,216 343,222"
          />
        </g>
        <circle class="ripple r1" cx="344" cy="270" r="48" />
        <circle class="ripple r2" cx="344" cy="270" r="48" />
        <g class="word">
          <text class="lt" x="364.5" y="340" text-anchor="middle">Auftakt</text>
        </g>
        <g class="mover">
          <g class="swing">
            <polygon class="actor" points="-0.2,-0.9 0.2,0.9 -96.3,27.1 -97.5,22.5" />
            <path
              class="actor"
              fill-rule="evenodd"
              d="M-87,19.2 C-87,18.3 -85.6,15.9 -86.9,13.5 C-88.2,11.1 -91.5,6.4 -94.8,4.7 C-98.1,3 -103,3 -106.5,3.5 C-110,4 -112.8,5.8 -115.8,7.4 C-118.8,9 -121.8,11.4 -124.6,13.3 C-127.4,15.2 -129.5,17.1 -132.5,18.9 C-135.5,20.7 -139.9,23.1 -142.5,24.3 C-145.1,25.5 -146.6,26.1 -148.1,26.3 C-149.6,26.5 -148.4,25.1 -151.5,25.3 C-154.6,25.5 -163.9,27.2 -166.4,27.6 L-162.4,55.5 L-146.1,50.3 C-145.3,49.9 -143.9,48.3 -141.5,48.1 C-139.1,47.9 -135.3,48.8 -131.9,49.3 C-128.5,49.8 -124.9,51 -121.1,51.1 C-117.3,51.2 -112.9,50.9 -109,50.1 C-105.1,49.4 -100.8,48 -97.5,46.6 C-94.2,45.3 -91.4,44 -89.4,42 C-87.4,40 -86.4,36.8 -85.7,34.3 C-85,31.8 -85.5,28.2 -85.5,27 Z M-91.2,16.4 L-97,11.7 L-96.5,11 L-90.6,15.7 Z M-90.8,32.6 L-90.6,41.4 L-91.6,41.4 L-91.8,32.7 Z M-98.8,35.7 L-98.2,45.9 L-99.2,45.9 L-99.8,35.8 Z M-107.3,41 L-107.1,47.7 L-108,47.7 L-108.2,41 Z M-148,26.1 L-144.1,49.3 L-145.5,49.6 L-149.4,26.3 Z"
            />
          </g>
        </g>
      </svg>
    </div>

    <script>
      (function () {
        var overlay = document.getElementById('boot-overlay');
        if (!overlay) return;
        var root = document.getElementById('root');
        var html = document.documentElement;
        var t0 = performance.now();

        /* Past this, the gesture is forfeit and the reveal is a plain cross-fade. It
           looks harsh next to the 2700 ms it guards, and it is meant to: hold plus
           gesture plus fade is already ~4.3 s of splash at this deadline. At the 2.5 s
           that felt natural it would be 5.6 s, which is worse than never animating. The
           gesture is a reward for a fast boot, never a tax on a slow one. */
        var GESTURE_DEADLINE = 1200;
        /* Reveal no matter what — a bundle that 404s, a signal that never comes. */
        var HOLD_MAX = 3500;
        var CROSS_MS = 200;
        /* The envelope plus bootOut's 370 ms fade. */
        var GESTURE_MS = 2700 + 370;

        var gone = false;
        var playing = false;
        var crossing = false;
        var gestureAllowed = true;
        var mounted = false;
        var failsafe = 0;

        /* One rearmable timer, not the fixed 4000 ms this replaces. That constant was
           armed at parse and sized for an animation that began at parse; now a gesture
           starting at the 1200 ms deadline ends at 4270 ms, so a fixed 4 s failsafe would
           cut off the very thing it exists to protect — one frame from the end, on slow
           machines only, intermittently. */
        function armFailsafe(ms) {
          clearTimeout(failsafe);
          failsafe = setTimeout(remove, ms);
        }

        function remove() {
          if (gone) return;
          gone = true;
          clearTimeout(failsafe);
          html.classList.remove('boot-hold', 'boot-play');
          html.dataset.boot = 'done';
          overlay.remove();
          if (root) root.inert = false;
          // The single exit of every path, so the one honest place to say "the boot
          // screen is gone" — it fires on the reveal, on a skip, on the failsafe, and
          // on the early return when nothing plays at all. Electron holds its startup
          // backup and update check until it hears this. Optional-chained twice: there
          // is no bridge on the dev server or in a plain browser.
          try {
            window.auftakt && window.auftakt.bootSettled && window.auftakt.bootSettled();
          } catch (e) {
            /* the chores have their own timeout; never let this break the reveal */
          }
        }
        // The two cases where nothing plays: hidden by CSS above, so drop the node
        // rather than leave an invisible one lying in the DOM.
        if (
          html.classList.contains('no-boot') ||
          matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          remove();
          return;
        }
        // The overlay's own pointer events only stop the mouse. Without this, a keyboard
        // or screen-reader user could Tab into the app underneath and activate controls
        // they cannot see, during the one interval a mouse user is locked out of — so the
        // barrier has to be on #root, not on the thing covering it. Set from script and
        // cleared in remove(), which is the single exit of all three paths (the fade's
        // animationend, the skip fade, the failsafe below). Deliberately not an attribute
        // in the markup: there it would outlive a script that failed to run, and the app
        // would be permanently unusable rather than merely un-animated.
        if (root) root.inert = true;

        // ---- phase A: hold ----------------------------------------------------------
        html.classList.add('boot-hold');
        html.dataset.boot = 'hold';
        armFailsafe(HOLD_MAX);
        setTimeout(function () {
          gestureAllowed = false;
        }, GESTURE_DEADLINE);

        // Descendant animations bubble their animationend too — only the overlay's
        // own fade, or the cross-fade, ends the show.
        overlay.addEventListener('animationend', function (e) {
          if (e.target === overlay) remove();
        });

        /* Someone clicking during the hold wants the app, not the choreography. Reveal
           if there is anything to reveal — a spinner beats a blank rectangle for a user
           who is actively poking at it — and otherwise just forfeit the gesture and keep
           holding, because a half-mounted tree is not worth showing. During the gesture
           this is the old click-to-skip. */
        overlay.addEventListener('pointerdown', function () {
          gestureAllowed = false;
          if (playing || mounted) crossFade();
        });

        // ---- the handshake ----------------------------------------------------------
        document.addEventListener('auftakt:mounted', function () {
          mounted = true;
        });
        document.addEventListener('auftakt:ready', onReady, { once: true });
        /* Race insurance. It cannot currently fire — this script runs during parse and
           the bundle is a deferred module — but that stops being true the day someone
           adds `async`, and the failure would be a permanently held boot screen. */
        if (html.dataset.appReady) onReady();

        function onReady() {
          if (gone || playing || crossing) return;
          /* Unhide #root first and let it paint. It is still behind an opaque overlay,
             so nothing is visible yet — but this moves the largest paint of the whole
             boot to *before* the first gesture frame instead of during it. Two frames,
             because the first only schedules the paint. */
          html.classList.remove('boot-hold');
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              /* An idle callback does not run while the main thread is busy, which is
                 exactly the precondition. The timeout keeps "wait for a free thread"
                 from becoming "wait forever". */
              if (window.requestIdleCallback) requestIdleCallback(start, { timeout: 200 });
              else setTimeout(start, 0);
            });
          });
        }

        function start() {
          if (gone || playing || crossing) return;
          if (!gestureAllowed || performance.now() - t0 > GESTURE_DEADLINE) return crossFade();
          playing = true;
          html.dataset.boot = 'play';
          html.classList.add('boot-play');
          armFailsafe(GESTURE_MS + 400);
        }

        // ---- the reveal without a gesture -------------------------------------------
        function crossFade() {
          if (gone || crossing) return;
          crossing = true;
          html.dataset.boot = 'cross';
          html.classList.remove('boot-hold', 'boot-play');
          overlay.classList.add('boot-cross');
          armFailsafe(CROSS_MS + 200);
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
