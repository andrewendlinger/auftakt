name: CodeQL

# Static analysis over the TypeScript. This catches a different class of defect than
# `npm run check`: the check scripts assert that the server behaves correctly on the paths
# they drive, CodeQL looks for the paths nobody drove — unsanitised input reaching a sink,
# a path join that escapes its root, a regex that backtracks. Auftakt reads user-supplied
# SQLite files and CSVs and renders user-authored Markdown, so those sinks are real.
#
# Separate workflow rather than a job in build.yml: it has nothing to do with producing an
# installer, needs `security-events: write` (which build.yml's jobs should not carry), and
# runs on a schedule, which build.yml does not.

on:
  push:
    branches:
      - main
  # Unfiltered, for the same reason as build.yml: a `branches: [main]` filter here would skip
  # any PR that does not target main, and a finding is worth having before the merge rather
  # than after it.
  pull_request:
  # CodeQL ships new queries; a repo that only scans on push stops learning about the code
  # it already has. Monday early, so a finding is waiting at the start of the week.
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No build step. `javascript-typescript` extracts from source, so this never needs
      # `npm ci`, a native better-sqlite3 compile, or the Python pin that build.yml needs.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          # `security-extended` over the default: this ships to end users as a desktop app
          # with filesystem access, and the extra precision costs a few minutes a week.
          queries: security-extended
          # …minus the one query that fires on every route handler in the server because the
          # app is loopback-only. The suite stays as selected above; the config file only
          # filters it, and says which change makes that filter wrong again.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:javascript-typescript
