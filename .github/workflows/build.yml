name: Build desktop apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Every pull request, whatever it targets. The `branches: [main]` filter that used to be here
  # looked harmless — every PR targets main eventually — but it meant a PR opened against any
  # other branch got no CI at all, and `main` requires the `checks` context to merge. A stacked
  # PR was therefore unmergeable by construction: no run could ever report, and retargeting it
  # to main when the base branch merged did not fire the workflow retroactively either.
  #
  # `push` stays filtered to main and tags, so a topic branch is checked once via its PR rather
  # than twice.
  pull_request:
  workflow_dispatch:

# Superseded runs of the same branch are wasted work, so cancel them — except on a tag.
# A tag run publishes a release; cancelling one halfway leaves a partial set of installers
# attached to a version that already exists, which cannot be re-cut without moving the tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Runs on every push, PR and tag — the installers below only build on a tag, so
  # without this job the repo's correctness gates would run at release time only and a
  # broken `main` would stay invisible until someone tried to ship it.
  #
  # Linux-only on purpose. Four of the five check scripts boot the real server and drive it;
  # `check-dates` re-runs the API under two timezones via `TZ`, and `check-backup`
  # exercises POSIX file permissions. Neither is worth reproducing on Windows, and a
  # false failure there would block releases, since `build` needs this job.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nothing here needs to write. Stated rather than inherited so that raising the
    # repository default cannot silently widen this job's token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # No workspaces — three independent installs, so every lockfile has to be named
      # or the cache key misses the two that do most of the work.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Typecheck
        run: npm run typecheck

      # Five gates. `check:unit` is client Vitest over the pure logic the others cannot reach;
      # the remaining four — backup/import, the naive-local-time convention, server data
      # invariants and the Markdown round-trip — boot the real server and drive it. The
      # load-bearing gate; docs/DECISIONS.md records why adding a test framework here was a
      # reversal rather than a default. `check:package` is deliberately not among them: it
      # inspects what electron-builder packed, so it needs a build and runs in `build` below.
      - name: Checks
        run: npm run check

      # Gating, as of 2026-08-11. This step carried `continue-on-error: true` while there was
      # a standing backlog of advisories — mostly the node-gyp/tar build-time chain that came
      # in through better-sqlite3's `prebuild-install` — because failing every PR on a backlog
      # nobody was clearing would have trained everyone to ignore the step.
      #
      # The backlog is gone. better-sqlite3 v13 is N-API and dropped `prebuild-install` with
      # its 26 transitive packages, js-yaml went to 4.3.1, and the react-router advisory was
      # revised to a patched version the client already had. All three directories now report
      # zero at `--audit-level=high`, so a failure here is news rather than noise.
      #
      # What is deliberately still allowed through: `server/` carries two *moderate*
      # advisories, exceljs and the uuid it pins, and neither has an upgrade that is not a
      # major downgrade. docs/DECISIONS.md records why they are not actionable. Raising this
      # to `--audit-level=moderate` would fail every PR on them.
      - name: Audit dependencies
        run: |
          rc=0
          for dir in . server client; do
            echo "::group::npm audit ($dir)"
            npm --prefix "$dir" audit --audit-level=high || rc=1
            echo "::endgroup::"
          done
          exit $rc

  # The browser gate, beside `checks` rather than inside it. `npm run check:browser` boots the
  # demo stack and drives it with Chromium, so it needs a browser binary and a free :5317 —
  # neither of which `npm run check` may ever require, since that has to stay runnable on any
  # machine at any moment. Unlike `check:package` it still runs on every pull request: it guards
  # the two-window season matrix and the core task/column/editor paths, and finding a regression
  # in those at release time is the cadence problem the whole reversal in docs/DECISIONS.md is
  # about. Parallel to `checks`, so it costs wall clock only when it fails.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      # `playwright-core` downloads nothing on install — that is why it is the dependency and
      # `playwright` is not (docs/DECISIONS.md). The browser is fetched below and cached on the
      # pinned playwright-core version, read straight from the committed lockfile — so a run only
      # pays for the download when that pin moves, not on every unrelated root-lockfile bump.
      # (Keying on hashFiles('package-lock.json') evicted this on every Dependabot root bump.)
      - name: Resolve Playwright version
        id: pw
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # No `--with-deps`. That flag runs `apt-get update` over *every* source on the runner image —
      # including the preinstalled Google Chrome and Microsoft repos, which have nothing to do with
      # Playwright — and one mirror mid-sync fails the whole step. It took PR #188 red on a
      # README-only change ("File has unexpected size … Mirror sync in progress?"). ubuntu-latest
      # already ships the shared libraries Chromium links against (it preinstalls Chrome, Chromium
      # and Edge), so the cached browser download above is all this needs. If a future image ever
      # drops a required lib, Chromium fails to *launch* here — loud, deterministic, on both this job
      # and `boot` — never an intermittent flake; add the flag back then.
      - name: Install Chromium
        run: npx playwright-core install chromium

      - name: Browser gate
        run: npm run check:browser

  # The boot gate, beside `browser` rather than inside it. It drives the same Chromium but against
  # a *built* bundle — the one surface `check:browser` cannot reach, since `#boot-overlay` does not
  # exist on the dev server — so it needs a `vite build` that job does not do, and it needs the
  # gesture *not* suppressed by `reducedMotion: 'reduce'`, which every case over there relies on.
  #
  # Its own job because of wall clock, not minutes. Measured on this repository: `checks` 54 s,
  # `browser` 246 s, CodeQL 86 s, and this gate ~35 s locally. Appended to `browser` it would push
  # the critical path from ~4.1 to ~5.3 min on every pull request; beside it, it finishes long
  # before `browser` does and PR feedback stays where it is. The duplicated setup — three `npm ci`
  # and a cache restore — is Actions minutes, which a public repository does not pay for.
  #
  # It needs no free :5317 and no `.demo`: the built client is served by the server itself, on
  # :4327, against a throwaway data dir.
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      # The same cache key as `browser` (keyed on the pinned playwright-core version), so the two
      # jobs share one download rather than paying for a browser each.
      - name: Resolve Playwright version
        id: pw
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # No `--with-deps`, for the same reason as `browser` above: it makes `apt-get update` scan the
      # runner's third-party mirrors, and one mid-sync fails the step. The runner already has the
      # libraries; the cached browser download above is all this needs.
      - name: Install Chromium
        run: npx playwright-core install chromium

      # The gate builds the client itself — a stale `client/dist` would be a silent false green,
      # which is the one failure mode it may not have.
      - name: Boot gate
        run: npm run check:boot

  build:
    needs: [checks, browser, boot]
    # The installers are the expensive half — two runners, a native rebuild of
    # better-sqlite3 and electron-builder. Only worth it for something publishable.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # id-token + attestations are needed to sign the build provenance below.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # better-sqlite3 has no prebuilt binary for every Node/arch combo and falls
      # back to node-gyp, which needs `distutils`. The runners ship Python 3.14
      # (distutils removed in 3.12), so pin 3.11 for a reliable native compile.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      # `ci`, not `install`: the lockfiles are committed, and a provenance attestation
      # that says "this binary came from this source" is worth little if the dependency
      # tree is resolved fresh on every build.
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      # Repeated from `checks` because that job runs on Linux only: this is what catches
      # a type error that is platform-specific. `npm run build` is vite + esbuild, and
      # neither does type analysis, so without this a type error reaches an installer.
      - name: Typecheck
        run: npm run typecheck

      # --publish never: GitHub Releases are created by the separate `release` job
      # below, so electron-builder must not also try to publish.
      - name: Build installers (dmg on macOS, NSIS on Windows)
        run: npm run build && npx electron-builder --publish never

      # What `typecheck` and `npm run check` structurally cannot see: both read source, and
      # neither looks at what electron-builder actually put inside the app. A `files` glob that
      # stops matching, or a better-sqlite3 packed into the asar instead of unpacked, produces a
      # green build and an app that dies for the user. Runs on both runners — the packing differs
      # per platform, so a check on one says nothing about the other.
      - name: Verify the packaged app
        run: npm run check:package

      # The Windows updater resolves what to install through `latest.yml`, so a name in there
      # that does not match the uploaded asset is a silent, total update failure — it shipped
      # once (v0.5.0) and was invisible until someone tried to update. electron-builder writes
      # the *GitHub-safe* spelling into `latest.yml` (space→`-`) while GitHub renames the upload
      # itself (space→`.`); `artifactName` in electron-builder.yml removes the spaces so the two
      # agree. This asserts they still do, before the artifact can reach a release.
      - name: Verify latest.yml points at a file that exists
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          named=$(grep -E '^path:' release/latest.yml | sed 's/^path:[[:space:]]*//')
          echo "latest.yml path: $named"
          if [ ! -f "release/$named" ]; then
            echo "::error::latest.yml names '$named' but release/ has no such file:"
            ls -1 release/
            exit 1
          fi
          case "$named" in
            *[!0-9A-Za-z._-]*)
              echo "::error::'$named' has characters GitHub will rename on upload; the updater will 404."
              exit 1 ;;
          esac
          echo "ok — $named exists and survives upload unrenamed"

      # The app is not signed with an Apple Developer ID, so users have no way to
      # tell where a downloaded installer came from. This signs a statement tying
      # each artifact to this commit and workflow run; verify a download with
      #   gh attestation verify <file> --repo <owner>/<repo>
      # Requires the repository to be public (or GitHub Advanced Security), so it is
      # skipped while this repo is private — otherwise it would fail here, before the
      # upload step, and take the whole release down with it (`release` needs `build`).
      #
      # Every published file is a subject, not just the installer. `latest.yml` is the
      # highest-value target in the release: it names the binary the Windows updater will
      # download and execute, and carries the sha512 that is the *only* integrity check
      # standing in for a code signature. Attesting the .exe while leaving the file that
      # points at it unattested covers the wrong half. Split per OS because the file sets
      # differ and a glob matching nothing is an error — macOS ships no latest.yml, having
      # no auto-update path without an Apple Developer ID.
      #
      # This does not close the gap, and SECURITY.md says so: electron-updater does not
      # verify attestations, so this makes tampering *detectable by someone who checks*,
      # not *rejected at install*. Code signing is what would do that.
      - name: Attest build provenance (Windows)
        if: ${{ !github.event.repository.private && matrix.os == 'windows-latest' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

      - name: Attest build provenance (macOS)
        if: ${{ !github.event.repository.private && matrix.os == 'macos-latest' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release/*.dmg
            release/*.blockmap

      # latest.yml + *.blockmap belong in the release next to the .exe: the in-app
      # Windows updater (electron-updater) resolves updates via latest.yml, and the
      # blockmap enables differential downloads. macOS has no auto-update (unsigned),
      # so no latest-mac.yml is built or shipped.
      # One SBOM per platform, because the trees genuinely differ — better-sqlite3 is rebuilt per
      # ABI and the optional platform packages that broke `npm ci` twice resolve differently on
      # each runner. A single SBOM would describe neither installer accurately.
      #
      # Worth having for a product that is sold: it is what turns "is Auftakt affected by this
      # CVE?" from an archaeology exercise across three lockfiles into a lookup, and what a
      # customer's IT department asks for before installing anything.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: auftakt-sbom-${{ matrix.os }}.spdx.json
          output-file: release/auftakt-sbom-${{ matrix.os }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auftakt-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/*.spdx.json
          if-no-files-found: ignore
          # On a tag this artifact is only the hand-off to the `release` job below, which
          # attaches the same files to the Release — where they live permanently and off
          # the Actions storage meter. Without this key the upload inherits the 90-day
          # default and every release parks a second ~225 MB copy for three months, which
          # is what took the account to 90% of its 0.5 GB storage allowance. A dispatch
          # build has no `release` job, so there the artifact *is* the deliverable: keep
          # it long enough to install and test by hand.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 7 }}

  # On a version tag (v1.2.3), gather both installers and publish a GitHub Release
  # so they can be downloaded from the repo's Releases page (not just the Actions run).
  # This is also what makes the 1-day artifact retention above safe: the Release, not the
  # workflow artifact, is the durable copy. Do not start relying on the artifact outliving
  # the run.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: installers

      # Every action here is pinned to a commit rather than a mutable tag. A tag can be
      # repointed by whoever owns the action; this job runs with `contents: write` and the
      # `build` job holds `attestations: write`, so a moved tag would be a supply-chain
      # write into the artifacts users install. Dependabot updates these like any other
      # dependency — the `# vN` comment is what it reads to know which tag a SHA tracks.
      # draft: true — the tag publishes a release nobody can download yet. Until this,
      # pushing a tag put installers in front of users with no step in between, so the
      # first person to find a bad build was a user. A draft is the smoke-test window:
      # download both installers, run docs/BACKUP-TESTING.md against them, then publish
      # from the Releases page.
      #
      # It also makes a bad release recoverable. Deleting a draft costs nothing; a
      # published release has already been fetched by update checks, and the tag cannot be
      # moved (see the release skill — fix forward with a new patch, never re-tag).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          draft: true
          files: |
            installers/**/*.dmg
            installers/**/*.exe
            installers/**/*.blockmap
            installers/**/latest.yml
            installers/**/*.spdx.json
          generate_release_notes: true
