appId: com.auftakt.app
productName: Auftakt
copyright: © 2026 Andre Wendlinger

directories:
  output: release
  buildResources: build

# No Apple Developer ID → electron-builder skips signing and the arm64 app would be
# "damaged". Ad-hoc sign the bundle so it is at least a valid arm64 app (see README).
afterSign: scripts/afterSign.cjs

# Not for publishing (CI builds with --publish never; the release job uploads the
# artifacts) — this config makes electron-builder embed app-update.yml into the app
# and emit latest.yml + *.blockmap, which the in-app Windows updater (electron-updater)
# resolves against the GitHub Release. macOS cannot auto-update without an Apple
# Developer ID, so only the Windows build uses it.
publish:
  provider: github
  owner: andrewendlinger
  repo: auftakt

# Built artifacts + the one native dependency (better-sqlite3 is added
# automatically as a production dependency and rebuilt for Electron's ABI).
files:
  - electron/dist/**
  - server/dist/**
  - client/dist/**
  - package.json

asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/*.node'

mac:
  target: dmg
  category: public.app-category.productivity

# The publisher shown in the file properties and in "Apps & Features" comes from
# `author` in package.json, not from `win.publisherName` — leave that one unset.
# It only feeds signtool's expected subject and, because `verifyUpdateCodeSignature`
# defaults to true, gets copied into app-update.yml; electron-updater skips its
# signature check exactly while that key is absent. Setting it on an unsigned
# installer would turn every in-app update into ERR_UPDATER_INVALID_SIGNATURE.
win:
  target: nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Auftakt
